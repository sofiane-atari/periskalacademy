<div class="container">
  <h2>Update Training</h2>

  @if (loading) {
  <div>Loading...</div>
  } @if (errorMessage) {
  <div>
    {{ errorMessage }}
  </div>
  } @if (training) {
  <form (ngSubmit)="updateTraining()">
    <div class="form-group">
      <label for="name">Training Name</label>
      <input
        type="text"
        id="name"
        class="form-control"
        [(ngModel)]="training.name"
        name="name"
        required
      />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        class="form-control"
        [(ngModel)]="training.description"
        name="description"
        required
      ></textarea>
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        Save Changes
      </button>
    </div>
  </form>
  <button (click)="confirmDelete()" class="delete">Delete training</button>
  <button (click)="goToModuleEditPage()">Edit modules</button>
  <button (click)="goToModuleAddPage()">Add a new module</button>
  } @if (!training) {
  <div>Training not found.</div>
  }
</div>
