<div class="columns">
  <div class="column"></div>
  <div class="column">
    <div class="field">
      <label>Naam van de training</label>
      <input [(ngModel)]="name" class="input" placeholder="Geef je naam" />
    </div>

    <div class="field">
      <label>Description</label>
      <input
        [(ngModel)]="description"
        class="input"
        placeholder="Geef de description van de training"
      />
    </div>

    <h3 class="modules">Modules</h3>
    <div class="module">
      <label>Module {{ index }}</label>
    </div>
    @for (module of products; track $index) {
    <div class="module">
      <p>Module</p>
      <label>Module Titel</label>
      <input [(ngModel)]="nameModule" />
      <label>Module Beschrijving</label>
      <input [(ngModel)]="descriptionModule" />
    </div>
    }
    <div>
      <button class="delete" (click)="RemoveProduct()">
        Module verwijderen
      </button>
    </div>
    <div>
      <button (click)="AddProduct()">Nieuwe module toevoegen</button>
    </div>
  </div>
  <div class="column"></div>
</div>
