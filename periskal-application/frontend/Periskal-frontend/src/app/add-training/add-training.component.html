<div class="columns">
  <div class="column"></div>
  <div class="column">
    <h1>{{'NEW_TRAINING_CREATE' | translate}}</h1>
    <form [formGroup]="trainingForm" (ngSubmit)="postTraining()">
      <h3 class="modules">{{'TRAINING_INFORMATION' | translate}}</h3>
      <div class="field">
        <label>{{'TRAINING_NAME' | translate}}</label>
        <input
          formControlName="name"
          class="input"
          placeholder="Geef de naam van de nieuwe training"
          required
        />
      </div>

      <div class="field">
        <label>{{'DESCRIPTION' | translate}}</label>
        <textarea
          formControlName="description"
          id="description"
          class="form-control"
          placeholder="Geef de beschrijving van de nieuwe training"
          name="description"
          required
        >
        </textarea>
      </div>

      <h3 class="modules">{{'MODULE_INFORMATION' | translate}}</h3>
      <div formArrayName="modules">
        @for (module of modules.controls; track $index) {
        <div [formGroupName]="$index" class="module">
          <h4>{{'MODULE' | translate}} {{ $index + 1 }}</h4>
          <div>
            <label>{{'MODULE_TITLE' | translate}}</label>
            <input
              formControlName="nameModule"
              placeholder="Geef de titel van module {{ $index + 1 }}"
              required
            />
          </div>
          <div>
            <label>{{'MODULE_DESCRIPTION' | translate}}</label>
            <textarea
              formControlName="descriptionModule"
              id="descriptionModule{{ $index }}"
              class="form-control"
              placeholder="Geef de beschrijving van module {{ $index + 1 }}"
              name="descriptionModule{{ $index }}"
              required
            >
            </textarea>
          </div>
          @if($index!=0) {
          <button class="delete" type="button" (click)="removeModule($index)">
            {{'DELETE_MODULE' | translate}}
          </button>
          }
        </div>
        }
      </div>
      <div>
        <button type="button" (click)="addModule()">
          {{'ADD_NEW_MODULE' | translate}}
        </button>
      </div>
      <div>
        <button type="submit" [disabled]="trainingForm.invalid">
          {{'CREATE_TRAINING' | translate}}
        </button>
      </div>
    </form>
  </div>
  <div class="column"></div>
</div>
