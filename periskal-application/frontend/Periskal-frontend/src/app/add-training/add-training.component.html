<div class="columns">
  <div class="column"></div>
  <div class="column">
    <h1>Nieuwe training aanmaken</h1>
    <form [formGroup]="trainingForm" (ngSubmit)="postTraining()">
      <h3 class="modules">Training informatie</h3>
      <div class="field">
        <label>Naam van de training</label>
        <input
          formControlName="name"
          class="input"
          placeholder="Geef de naam van de nieuwe training"
          required
        />
      </div>
      
      <div class="field">
        <label>Description</label>
        <textarea
          formControlName="description"
          id="description"
          class="form-control"
          placeholder="Geef de beschrijving van de nieuwe training"
          name="description"
          required
        >
        </textarea>
      </div>
      
      <h3 class="modules">Modules informatie</h3>
      <div formArrayName="modules">
        @for (module of modules.controls; track $index) {
        <div [formGroupName]="$index" class="module">
          <h4>Module {{ $index + 1 }}</h4>
          <div>
            <label>Module Titel</label>
            <input
              formControlName="nameModule"
              placeholder="Geef de titel van module {{ $index + 1 }}"
              required
            />
          </div>
          <div>
            <label>Module Beschrijving</label>
            <textarea
              formControlName="descriptionModule"
              id="descriptionModule{{ $index }}"
              class="form-control"
              placeholder="Geef de beschrijving van module {{ $index + 1 }}"
              name="descriptionModule{{ $index }}"
              required
            >
            </textarea>
          </div>
          
          <div>
            <h4>Module {{ $index + 1 }} hoofdstukken</h4>
            <div formArrayName="chapters">
              <div class="chapter">
                <h5>Hoofdstuk 1</h5>
                <div>
                  <label>Hoofdstuk Titel</label>
                  <input
                    formControlName="nameChapter"
                    placeholder="Geef de titel van hoofdstuk 1"
                    required
                  />
                </div>
                <div>
                  <label>Hoofdstuk Beschrijving</label>
                  <textarea
                    formControlName="descriptionChapter"
                    id="descriptionChapter{{ $index }}_1"
                    class="form-control"
                    placeholder="Geef de beschrijving van hoofdstuk 1"
                    name="descriptionChapter{{ $index }}_1"
                    required
                  >
                  </textarea>
                </div>
                <div>
                  <label>Hoofdstuk Tekst</label>
                  <textarea
                    formControlName="textChapter"
                    id="textChapter{{ $index }}_1"
                    class="form-control"
                    placeholder="Geef de tekst van hoofdstuk 1"
                    name="textChapter{{ $index }}_1"
                    required
                  >
                  </textarea>
                </div>
              </div>
            </div>
            <div>
              <button type="button">
                Nieuw hoofdstuk toevoegen
              </button>
            </div>
          </div>
          
          @if($index!=0) {
          <button class="delete" type="button" (click)="removeModule($index)">
            Module verwijderen
          </button>
          }
        </div>
        }
      </div>
      <div>
        <button type="button" (click)="addModule()">
          Nieuwe module toevoegen
        </button>
      </div>
      <div>
        <button type="submit" [disabled]="trainingForm.invalid">
          Maak training aan
        </button>
      </div>
    </form>
  </div>
  <div class="column"></div>
</div>
