<div>
    <div>
      <h4>Hoofdstukken</h4>
      <ul>
        @for (chapter of chapters; track $index) {
            <li
                [class.active]="$index === activeChapterId"
                (click)="setActiveChapter($index)">
              {{ chapter.id }} {{ chapter.nameChapter }}
            </li>
          }
      </ul>
    </div>
    
    <div>
      <div>
        <div>
          <h3>Hoofdstuk {{activeChapterId+1}}: {{ chapters[activeChapterId].nameChapter }}</h3>
        </div>
        <div>
          <h5>Beschrijving</h5>
          <p>{{ chapters[activeChapterId].descriptionChapter }}</p>
          
          <h5>Inhoud</h5>
          <p [innerHTML]="formatText(chapters[activeChapterId].textChapter.toString())"></p>
        </div>
      </div>
    </div>
  </div>
