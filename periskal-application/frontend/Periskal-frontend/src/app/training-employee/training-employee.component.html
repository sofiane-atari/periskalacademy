<div class="container">
  @for (training of trainingsData; track $index) {
  <div class="training">
    <div>
      <h1>{{ training.name }}</h1>
      <p>{{ training.description }}</p>
    </div>
    <div class="training-buttons">
      <button (click)="goToTrainingDetails(training.id)">Modules</button>
      <button (click)="goToEditPage(training.id)">Edit</button>
    </div>
  </div>
  }
</div>
<div class="add">
  <button class="add" (click)="goToAddPage()">+</button>
</div>
