<div class="container">
  @for (training of trainingsData; track $index) {
  <div class="training">
    <div>
      <h1>{{ training.name_en }}</h1>
      <p>{{ training.description_en }}</p>
    </div>
    <div class="training-buttons">
      <button (click)="goToTrainingDetails(training.id)">{{'MODULES' | translate}}</button>
      @if (roleAuth.canEditContent()) {
        <button (click)="goToEditPage(training.id)">{{'EDIT' | translate}}</button>
      }
    </div>
  </div>
  }
</div>
@if (roleAuth.canAddContent()) {
  <div class="add">
    <button class="add" (click)="goToAddPage()">+</button>
  </div>
}
