<div class="container mt-5">
    <div class="card shadow-sm">
      <div class="card-header text-black">
        <h4 class="mb-0">Examen aanpassen</h4>
      </div>
      <div class="card-body">
        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="examTitle" class="form-label">Titel</label>
            <input
              type="text"
              id="examTitle"
              [(ngModel)]="exam.examTitle"
              name="examTitle"
              class="form-control"
              required
            />
          </div>
  
          <div class="mb-3">
            <label for="examDescription" class="form-label">Beschrijving</label>
            <textarea
              id="examDescription"
              class="form-control"
              [(ngModel)]="exam.examDescription"
              name="examDescription"
              rows="4"
              required
            ></textarea>
          </div>

          <h4 class="mt-4">Examenvragen</h4>

          @for(question of exam.questions; track $index){
          <div class="mb-2">
            <div class="input-group">
              <input type="text"
                     class="form-control"
                     [(ngModel)]="question.text"
                     [name]="'question_' + $index"
                     placeholder="Vraagtekst"
                     required>
              <button type="button" class="btn btn-danger" (click)="removeQuestion($index)">
                Verwijder
              </button>
            </div>
          </div>
        }
      
          <button type="button" class="btn btn-secondary mt-2" (click)="addQuestion()">
            Voeg vraag toe
          </button>
  
          <button type="submit" class="btn w-100">
            Opslaan
          </button>

          <button class="delete" type="button" class="btn w-100" (click)="confirmDeleteExam()">
            Delete
          </button>
        </form>
      </div>
    </div>
  </div>
