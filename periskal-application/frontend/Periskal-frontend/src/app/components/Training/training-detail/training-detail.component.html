<div class="container">
  <h2>{{ training?.nameEn }} {{'MODULES' | translate }}</h2>
  @for (module of modules; track $index) {
  <div class="product">
    <h3>{{ getModuleTitle($index) }}</h3>
    <p>{{ getModuleDescription($index) }}</p>
    <button (click)="goToChaptersPage($index+1)">{{'TAKE_COURSE' | translate }}</button>
  </div>
  }
</div>
