<div class="container">
  <h2>{{'UPDATE_TRAINING' | translate }}</h2>

  @if (loading) {
  <div>{{'LOADING' | translate}}</div>
  } @if (errorMessage) {
  <div>
    {{ errorMessage }}
  </div>
  } @if (training) {
    <mat-horizontal-stepper>
      <mat-step>
        <mat-label>Product Code</mat-label>
        <input matInput [(ngModel)]="training.productCode">
        <mat-tab-group>
          <mat-tab label="English">
            <mat-label>Training Name</mat-label>
            <input matInput [(ngModel)]="training.nameEn">
            <mat-label>Training description</mat-label>
            <input matInput [(ngModel)]="training.descriptionEn">
          </mat-tab>
          <mat-tab label="dutch">
            <mat-label>Training Name</mat-label>
            <input matInput [(ngModel)]="training.nameNl">
            <mat-label>Training description</mat-label>
            <input matInput [(ngModel)]="training.descriptionNl">
          </mat-tab>
        </mat-tab-group>
      </mat-step>
    </mat-horizontal-stepper>
    <div>
      <button (click)="updateTraining()">Update training</button>
    </div>
  <div>
    <button class="btn btn-primary" (click)="goToModuleAddPage()">{{"ADD_NEW_MODULE" | translate}}</button>
  </div>
  <div>
    <button (click)="deleteTraining()" class="delete">{{"DELETE_TRAINING" | translate}}</button>
  </div>
  } @if (!training) {
  <div>{{'TRAINING_NOT_FOUND' | translate}}</div>
  }
</div>
