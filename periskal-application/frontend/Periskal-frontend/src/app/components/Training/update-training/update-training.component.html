<div class="container">
  <h2>{{'UPDATE_TRAINING' | translate }}</h2>

  @if (loading) {
  <div>{{'LOADING' | translate}}</div>
  } @if (errorMessage) {
  <div>
    {{ errorMessage }}
  </div>
  } @if (training) {
  <form (ngSubmit)="updateTraining()">
    <div class="form-group">
      <label for="name">{{'TRAINING_NAME' | translate}}</label>
      <input
        type="text"
        id="name"
        class="form-control"
        [(ngModel)]="training.name_en"
        name="name"
        required
      />
    </div>

    <div class="form-group">
      <label for="description">{{'DESCRIPTION' | translate}}</label>
      <textarea
        id="description"
        class="form-control"
        [(ngModel)]="training.description_en"
        name="description"
        required
      ></textarea>
    </div>

    @for (module of training.modules; track $index) {
    <div class="module">
      <div>
        <label for="nameModule{{ $index }}">{{'MODULE' | translate}} {{ $index + 1 }} {{'NAME' | translate}}</label>
        <input
          type="text"
          id="nameModule{{ $index }}"
          class="form-control"
          [(ngModel)]="module.nameModule"
          name="nameModule{{ $index }}"
          required
        />
      </div>
      <div>
        <label for="nameDescription{{ $index }}"
          >{{'MODULE' | translate}} {{ $index + 1 }} {{'DESCRIPTION' | translate}}</label
        >
        <textarea
          id="descriptionModule{{ $index }}"
          class="form-control"
          [(ngModel)]="module.descriptionModule"
          name="descriptionModule{{ $index }}"
          required
        >
        </textarea>
      </div>
      <button type="button" class="btn btn-danger">
        {{'DELETE_MODULE' | translate}}
      </button>
    </div>
    }
    <div class="form-group">
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{'SAVE_CHANGES' | translate}}
      </button>
    </div>
  </form>
  <button (click)="confirmDelete()" class="delete">Delete training</button>
  <button (click)="goToModuleAddPage()">Add a new module</button>
  } @if (!training) {
  <div>{{'TRAINING_NOT_FOUND' | translate}}</div>
  }
</div>
