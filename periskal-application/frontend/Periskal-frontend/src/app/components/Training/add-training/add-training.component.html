<mat-vertical-stepper linear #stepper>
  <!-- Step 1: General Info -->
  <mat-step [stepControl]="trainingForm">
    <form [formGroup]="trainingForm">
      <ng-template matStepLabel>{{'TRAINING_INFORMATION' | translate}}</ng-template>
      
      <label>{{'PRODUCT_CODE' | translate}}</label>
      <input formControlName="product_code" required />

      <div>
        <button mat-button matStepperNext>{{'NEXT' | translate}}</button>
      </div>
    </form>
  </mat-step>
  <!-- Step 2: English -->
  <mat-step [stepControl]="trainingForm"></mat-step>
  <!-- Step 3: Dutch -->
   <mat-step></mat-step>
  <!-- Step 4: French -->
  <mat-step></mat-step>
  <!-- Step 5: German -->
  <mat-step></mat-step>
</mat-vertical-stepper>
