<div class="container">
  @for (training of trainingsData; track $index) {
    <div class="training">
      <div>
        <h1>{{ training.name_nl }}</h1>
        <p>{{ training.description_nl }}</p>
      </div>
      <div>
        <div class="training-buttons">
          <button (click)="goToTrainingDetails(training.id)">{{'MODULES' | translate}}</button>
          @if (roleAuth.canEditContent()) {
            <button (click)="toggleMenuEdit(training.id)">{{'EDIT' | translate}}</button>
            <div class="dropdown-menu-edit" [class.show]="openMenus[training.id]">
              <button class="edit-exam" (click)="goToEditTrainingPage(training.id)">
                {{'EDIT_TRAINING' | translate}}
              </button>
              <button class="edit-exam" (click)="goToEditExamPage()">
                {{'EDIT_EXAM' | translate}}
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  }

  @if (roleAuth.canAddContent()) {
    <div class="add">
      <button class="add" (click)="toggleMenuAdd()">+</button>
      <div class="dropdown-menu" [class.show]="menuOpenAdd">
        <button (click)="goToAddTrainingPage()">{{'ADD_TRAINING' | translate}}</button>
        <button (click)="goToAddExamPage()">{{'ADD_EXAM' | translate}}</button>
      </div>
    </div>
  }
</div>
