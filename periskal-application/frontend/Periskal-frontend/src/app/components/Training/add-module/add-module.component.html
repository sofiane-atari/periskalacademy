<form [formGroup]="moduleForm" (ngSubmit)="postModule()" class="module-form">
  <h2>{{"ADD_NEW_MODULE" | translate}}</h2>

  <!-- Module Name -->
  <div class="form-group">
    <label for="nameModule_en">{{"MODULE_NAME" | translate}}:</label>
    <input id="nameModule_en" formControlName="nameModule_en" placeholder="Voer module naam in" />
  </div>

  <div class="form-group">
    <label for="nameModule_nl">{{"MODULE_NAME" | translate}}:</label>
    <input id="nameModule_nl" formControlName="nameModule_nl" placeholder="Voer module naam in" />
  </div>
  <div class="form-group">
    <label for="nameModule_fr">{{"MODULE_NAME" | translate}}:</label>
    <input id="nameModule_fr" formControlName="nameModule_fr" placeholder="Voer module naam in" />
  </div>
  <div class="form-group">
    <label for="nameModule_de">{{"MODULE_NAME" | translate}}:</label>
    <input id="nameModule_de" formControlName="nameModule_de" placeholder="Voer module naam in" />
  </div>

  <!-- Module Description -->
  <div class="form-group">
    <label for="descriptionModule_en">{{"MODULE_DESCRIPTION" | translate}}:</label>
    <textarea id="descriptionModule_en" formControlName="descriptionModule_en" placeholder="Voer module beschrijving in"></textarea>
  </div>
  <div class="form-group">
    <label for="descriptionModule_nl">{{"MODULE_DESCRIPTION" | translate}}:</label>
    <textarea id="descriptionModule_nl" formControlName="descriptionModule_nl" placeholder="Voer module beschrijving in"></textarea>
  </div>
  <div class="form-group">
    <label for="descriptionModule_fr">{{"MODULE_DESCRIPTION" | translate}}:</label>
    <textarea id="descriptionModule_fr" formControlName="descriptionModule_fr" placeholder="Voer module beschrijving in"></textarea>
  </div>
  <div class="form-group">
    <label for="descriptionModule_de">{{"MODULE_DESCRIPTION" | translate}}:</label>
    <textarea id="descriptionModule_de" formControlName="descriptionModule_de" placeholder="Voer module beschrijving in"></textarea>
  </div>
  

   <!-- chapters to be implemented-->

  <!-- Form Buttons -->
  <div class="form-buttons">
    <button type="submit" [disabled]="!moduleForm.valid">{{"SAVE" | translate}}</button>
    <button type="button" (click)="resetForm()">{{"RESET" | translate}}</button>
  </div>
</form>
