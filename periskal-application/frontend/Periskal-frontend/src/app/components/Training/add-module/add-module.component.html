<form [formGroup]="moduleForm" (ngSubmit)="postModule()" class="module-form">
  <h2>{{"ADD_NEW_MODULE" | translate}}</h2>

  <!-- Module Name -->
  <div class="form-group">
    <label for="nameModule">{{"MODULE_NAME" | translate}}:</label>
    <input id="nameModule" formControlName="nameModule" placeholder="Voer module naam in" />
  </div>

  <!-- Module Description -->
  <div class="form-group">
    <label for="descriptionModule">{{"MODULE_DESCRIPTION" | translate}}:</label>
    <textarea id="descriptionModule" formControlName="descriptionModule" placeholder="Voer module beschrijving in"></textarea>
  </div>

   <!-- chapters to be implemented-->

  <!-- Form Buttons -->
  <div class="form-buttons">
    <button type="submit" [disabled]="!moduleForm.valid">{{"SAVE" | translate}}</button>
    <button type="button" (click)="resetForm()">{{"RESET" | translate}}</button>
  </div>
</form>
