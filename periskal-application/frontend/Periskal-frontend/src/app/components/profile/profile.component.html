<div class="profile-container">
  <h2>User Profile</h2>
  <div class="profile-info">
    <div class="info-row">
      <span class="label">ID:</span>
      <span class="value">{{userProfile.id}}</span>
    </div>
    <div class="info-row">
      <span class="label">Username:</span>
      <span class="value">{{userProfile.username}}</span>
    </div>
    <div class="info-row">
      <span class="label">First Name:</span>
      <span class="value">{{userProfile.firstname}}</span>
    </div>
    <div class="info-row">
      <span class="label">Last Name:</span>
      <span class="value">{{userProfile.lastname}}</span>
    </div>
    <div class="info-row">
      <span class="label">Role:</span>
      <span class="value">{{userProfile.role}}</span>
    </div>
  </div>
</div>
