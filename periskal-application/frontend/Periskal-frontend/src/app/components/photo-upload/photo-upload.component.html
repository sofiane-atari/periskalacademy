<div class="photo-upload-container">
  <label for="photo-upload">Upload Photos</label>
  <input
    type="file"
    id="photo-upload"
    (change)="onFileSelected($event)"
    accept="image/*"
    multiple
  />

  @if (photos.length > 0) {
  <div class="photo-preview-container">
    @for (photo of photos; track $index) {
    <div class="photo-preview">
      <img [src]="photo.imageData" alt="Photo Preview" class="photo-preview-image" />
      <button class="remove-btn" (click)="removePhoto($index)">Remove</button>
    </div>
  }
  </div>
}
</div>
