@if(!isLoginPage()) {
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Periskal Navbar</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg custom-navbar">
      <div class="container">
        <a class="navbar-brand text-dark" href="#">Periskal</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link text-dark"
                routerLink="/trainingEmployee"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                >Employee dashboard</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link text-dark"
                routerLink="/test"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                >Test Component</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="#">Skippers</a>
            </li>
          </ul>
          <!-- Taal dropdown -->
          <div class="dropdown language-dropdown ms-3">
            <button
              class="btn dropdown-toggle"
              type="button"
              id="languageDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="fas fa-globe"></i> Taal
            </button>
            <ul class="dropdown-menu" aria-labelledby="languageDropdown">
              <li>
                <a class="dropdown-item" href="#">
                  <img
                    src="https://flagcdn.com/w40/nl.png"
                    width="20"
                    class="me-2"
                  />
                  Nederlands
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="#">
                  <img
                    src="https://flagcdn.com/w40/gb.png"
                    width="20"
                    class="me-2"
                  />
                  English
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="#">
                  <img
                    src="https://flagcdn.com/w40/fr.png"
                    width="20"
                    class="me-2"
                  />
                  Français
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="#">
                  <img
                    src="https://flagcdn.com/w40/de.png"
                    width="20"
                    class="me-2"
                  />
                  Deutsch
                </a>
              </li>
            </ul>
          </div>
          <!-- Profiel icoontje -->
          <div class="ms-auto">
            <a class="nav-link text-dark" href="#">
              <i class="fas fa-user profile-icon"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>

}
<router-outlet></router-outlet>
