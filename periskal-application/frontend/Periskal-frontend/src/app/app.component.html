@if(showNavbar) {
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Periskal</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg custom-navbar">
      <div class="container">
        <p class="navbar-brand text-dark">Periskal</p>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link text-dark"
                routerLink="/trainingEmployee"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                >{{'EMPLOYEE_DASHBOARD' | translate}}</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link text-dark"
                routerLink="/test"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                >{{'TEST_COMPONENT' | translate}}</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="#">{{'HOME' | translate }}</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-dark" href="#">{{'SKIPPERS' | translate}}</a>
            </li>
          </ul>
          <!-- Taal dropdown -->
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <select class="form-select" (change)="ChangeLang($event)" id="">
                <option [selected]="lang === 'nl'" value="nl">Nederlands</option>
                <option [selected]="lang === 'en'" value="en">English</option>
                <option [selected]="lang === 'fr'" value="fr">Français</option>
                <option [selected]="lang === 'de'" value="de">Deutsch</option>
              </select>
            </li>
          </ul>

          <!-- Profiel icoontje -->
          <div class="ms-auto">
            <a class="nav-link text-dark" routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">
              <i class="fas fa-user profile-icon"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>

}
<router-outlet></router-outlet>
